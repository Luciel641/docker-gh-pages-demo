<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Docker + GitHub Actions 入门 Demo</title>
    <!-- Vite 会自动把相对路径重写成带 base 的路径 -->
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main class="card">
      <h1>🚀 Docker + GitHub Actions</h1>
      <p class="sub">
        这个页面由 <b>Docker 多阶段构建</b> 产出静态文件，
